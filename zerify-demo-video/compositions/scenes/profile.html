<!doctype html>
<html lang="en" data-composition-variables="[{&quot;id&quot;:&quot;title&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Scene title&quot;,&quot;default&quot;:&quot;Open Sushabhan’s creator profile&quot;,&quot;maxLength&quot;:80},{&quot;id&quot;:&quot;subtitle&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Context&quot;,&quot;default&quot;:&quot;Portfolio · Connected social accounts&quot;,&quot;maxLength&quot;:100},{&quot;id&quot;:&quot;capture&quot;,&quot;type&quot;:&quot;image&quot;,&quot;label&quot;:&quot;App capture&quot;,&quot;default&quot;:&quot;assets/captures/11-profile-overview.png&quot;}]">
<body><template>
  <style>
    #root { position:absolute; inset:0; overflow:hidden; font-family:Inter,sans-serif; color:#171326; }
    #profile-ground { position:absolute; inset:0; background:#f4f2fa; }
    #profile-context { position:absolute; left:192px; top:56px; width:1536px; height:42px; font-size:28px; line-height:42px; font-weight:400; color:#65586f; }
    #profile-title { position:absolute; left:192px; top:103px; width:1536px; height:55px; margin:0; font-size:40px; line-height:55px; font-weight:700; letter-spacing:-1px; color:#171326; }
    #profile-screen { position:absolute; left:80px; top:228.334px; width:1760px; height:733.333px; overflow:hidden; border-radius:20px; box-shadow:0 18px 50px rgba(23,19,38,.12); background:white; }
    #profile-camera { position:absolute; inset:0; width:100%; height:100%; transform-origin:0 0; }
    #profile-capture { position:absolute; left:0; top:-73.333px; width:1760px; height:990px; max-width:none; object-fit:fill; }
    #profile-cursor { position:absolute; left:0; top:0; width:40px; height:40px; transform-origin:8.33px 5px; z-index:3; }
    #profile-cursor path { fill:#fff; stroke:#171326; stroke-width:1.35; stroke-linejoin:round; }

  </style>
  <div id="root" data-composition-id="profile" data-duration="6" data-width="1920" data-height="1080">
    <div id="profile-ground"></div>
    <div id="profile-context" data-var-text="subtitle">Portfolio · Connected social accounts</div>
    <h1 id="profile-title" data-var-text="title">Open Sushabhan’s creator profile</h1>

      <div id="profile-camera">
        <img id="profile-capture" class="clip" data-start="0" data-duration="6" data-track-index="1" data-var-src="capture" src="assets/captures/11-profile-overview.png" alt="Open Sushabhan’s creator profile" />
      </div>
    </div>
  </div>
  <script>
    (function(){
      var tl=gsap.timeline({paused:true});
      tl.fromTo('#profile-camera',{x:0,y:0,scale:1},{x:-184.448,y:0,scale:1.12,duration:.85,ease:'power2.inOut',immediateRender:false},2);
      tl.to('#profile-camera',{x:0,y:0,scale:1,duration:.65,ease:'power2.inOut'},4.9);
      
      window.__timelines=window.__timelines||{};
      window.__timelines['profile']=tl;
    })();
  </script>
