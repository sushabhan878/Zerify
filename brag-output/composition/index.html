<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        background: #07090E;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #07090E;
        overflow: hidden;
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="21.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: The Problem & Hook (0.0s - 4.5s) -->
      <div
        id="scene-1"
        class="scene-host"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1-hook.html"
        data-start="0"
        data-duration="4.5"
      ></div>

      <!-- Scene 2: Reveal - Introducing Zerify (4.5s - 9.0s) -->
      <div
        id="scene-2"
        class="scene-host"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2-reveal.html"
        data-start="4.5"
        data-duration="4.5"
      ></div>

      <!-- Scene 3: Deep Feature 1 - AI Creator Match & Discovery (9.0s - 13.5s) -->
      <div
        id="scene-3"
        class="scene-host"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3-discovery.html"
        data-start="9.0"
        data-duration="4.5"
      ></div>

      <!-- Scene 4: Deep Feature 2 - Workspace, Escrow & Live Analytics (13.5s - 17.8s) -->
      <div
        id="scene-4"
        class="scene-host"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4-workspace.html"
        data-start="13.5"
        data-duration="4.3"
      ></div>

      <!-- Scene 5: Outro & Call to Action (17.8s - 21.5s) -->
      <div
        id="scene-5"
        class="scene-host"
        data-composition-id="scene5"
        data-composition-src="compositions/scene5-outro.html"
        data-start="17.8"
        data-duration="3.7"
      ></div>

      <!-- Audio Track: Music -->
      <audio
        id="bgm"
        data-start="0"
        data-duration="21.5"
        data-volume="0.72"
        data-fade-in="0.4"
        data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>

      <!-- Audio Cues: SFX Accents with exact sample durations -->
      <audio
        id="sfx-reveal"

      ></audio>

      <audio

        src="assets/sfx/card-slide-1.ogg"
      ></audio>

      <audio
